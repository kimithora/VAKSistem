<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Sistem VAK</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

    <div class="login-background">
        <img src="{{ url_for('static', filename='assets/background.jpg') }}" alt="Background">
    </div>

    <header>

        <h1>Login Sistem</h1>

        <p>
            Sistem Analisis Gaya Belajar VAK
        </p>

        <nav>

            <a href="{{ url_for('tentang') }}">
                Tentang Penelitian
            </a>

        </nav>

        <hr>

    </header>


    <main>

        <section>

            <h2>Masuk ke Sistem</h2>

            <p>
                Silakan masukkan token yang telah diberikan
                untuk mengakses sistem.
            </p>


            {% if error %}

                <p>
                    <strong>{{ error }}</strong>
                </p>

            {% endif %}


            <form
                action="{{ url_for('login') }}"
                method="POST"
            >

                <div>

                    <label for="token">
                        Token
                    </label>

                    <br>

                    <input
                        type="password"
                        id="token"
                        name="token"
                        placeholder="Masukkan token"
                        required
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        id="toggle-token"
                        class="toggle-token"
                        aria-label="Tampilkan token"
                    >
                        Tampilkan
                    </button>

                </div>

                <br>

                <button type="submit">
                    Masuk
                </button>

            </form>

        </section>

    </main>


    <footer>

        <hr>

        <p>
            Sistem Analisis Gaya Belajar VAK
        </p>

    </footer>

</body>

</html>
