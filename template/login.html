<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Sistem VAK</title>
</head>

<body>

    <!-- ==============================
         HEADER
    =============================== -->

    <header>

        <h1>Login Sistem</h1>

        <p>
            Sistem Analisis Gaya Belajar VAK
        </p>

        <nav>

            <a href="{{ url_for('tentang') }}">
                Tentang Penelitian
            </a>

        </nav>

        <hr>

    </header>


    <!-- ==============================
         FORM LOGIN
    =============================== -->

    <main>

        <section>

            <h2>Masuk ke Sistem</h2>

            <p>
                Silakan masukkan token yang telah diberikan
                untuk mengakses sistem.
            </p>


            <!-- Pesan error dari Flask -->

            {% if error %}

                <p>
                    <strong>{{ error }}</strong>
                </p>

            {% endif %}


            <form
                action="{{ url_for('login') }}"
                method="POST"
            >

                <div>

                    <label for="token">
                        Token
                    </label>

                    <br>

                    <input
                        type="text"
                        id="token"
                        name="token"
                        placeholder="Masukkan token"
                        required
                        autocomplete="off"
                    >

                </div>

                <br>

                <button type="submit">
                    Masuk
                </button>

            </form>

        </section>

    </main>


    <!-- ==============================
         FOOTER
    =============================== -->

    <footer>

        <hr>

        <p>
            Sistem Analisis Gaya Belajar VAK
        </p>

    </footer>

</body>

</html>
